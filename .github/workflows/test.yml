name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke test
        run: node tools/smoke.mjs
      - name: Check smoke results
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync('tools/out/smoke.json','utf8'));
            const failed = r.filter(b => !b.pass);
            if (failed.length) {
              console.error('SMOKE FAILURES:');
              for (const b of failed) console.error(' ', b.subjectId+'/'+b.benchId, b.failureTypes.join(', '));
              process.exit(1);
            }
            console.log('All', r.length, 'benches passed.');
          "
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-out
          path: tools/out/
          retention-days: 7
